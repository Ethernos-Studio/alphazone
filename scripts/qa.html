<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Alpha Zone · layout QA</title><style>body{margin:0;background:#52616b;color:white;font:12px sans-serif}header{height:48px;display:flex;align-items:center;justify-content:center;gap:16px}button{padding:7px 13px;cursor:pointer}iframe{display:block;border:0;margin:auto;background:#101c25;max-width:none}pre{padding:20px;white-space:pre-wrap}</style><header><span>本地布局验证</span><button onclick="size(390)">390</button><button onclick="size(768)">768</button><button onclick="size(1440)">1440</button><button onclick="runChecks()">运行检查</button><a href="/" style="color:white">返回网站</a></header><iframe id="preview" title="响应式网站预览" src="../index.html" width="390" height="844"></iframe><pre id="report"></pre><script>
const frame=document.querySelector('iframe');function size(w){frame.style.width=w+'px';frame.width=w;}window.runChecks=async()=>{const w=frame.contentWindow,d=w.document,errors=[],results=[];const tick=()=>new Promise(r=>setTimeout(r,80));for(const width of [360,390,520,768,1024,1440,1920]){size(width);await tick();const overflow=d.documentElement.scrollWidth>d.documentElement.clientWidth;results.push({width,client:d.documentElement.clientWidth,overflow});if(overflow)errors.push('overflow '+width);}size(390);await tick();for(const phase of w.AZ_STORY.phases){d.querySelector(`[data-phase="${phase.id}"]`).click();for(const event of w.AZ_STORY.events.filter(e=>e.phase===phase.id)){d.querySelector(`[data-event="${event.id}"]`).click();if(d.querySelector('#event-title').textContent!==event.title)errors.push('title '+event.id);if(!d.querySelector('#event-content').textContent.includes(event.text))errors.push('body '+event.id);if(!d.querySelector('#event-content').textContent.includes(event.news))errors.push('news '+event.id);for(const b of event.bullets||[]){if(!d.querySelector('#event-content').textContent.includes(b))errors.push('bullet '+event.id);}}}for(const place of w.AZ_STORY.locations){d.querySelector(`[data-location="${place.id}"]`).click();if(d.querySelector('#location-title').textContent!==place.name)errors.push('location '+place.id);}const tuner=d.querySelector('#radio-tuner'), frequencies=['081.2','084.5','087.6','091.3','096.0'];for(let i=0;i<5;i++){tuner.value=i;tuner.dispatchEvent(new Event('input',{bubbles:true}));if(d.querySelector('#frequency-value').textContent!==frequencies[i])errors.push('radio '+i);}const first=d.querySelector('[data-phase="0"]');first.click();if(!d.querySelector('#previous-event').disabled)errors.push('previous not disabled');for(let i=1;i<21;i++)d.querySelector('#next-event').click();if(!d.querySelector('#next-event').disabled)errors.push('next not disabled');d.querySelector('.menu-toggle').click();if(d.querySelector('#mobile-nav').hidden)errors.push('mobile menu');d.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));if(!d.querySelector('#mobile-nav').hidden)errors.push('menu escape');d.querySelector('[data-phase="2"]').click();d.querySelector('[data-event="2028-08-05"]').click();w.scrollTo({top:0,behavior:'instant'});const result={errors,layouts:results,events:21,locations:4,radioChannels:5,fonts:d.fonts.check('700 20px BigShoulders')};document.querySelector('#report').textContent=JSON.stringify(result,null,2);return result;};
</script></html>
